name: Release

# Pushing a version tag (v1.1.0, v2.0.0-rc1, ...) builds the downloadable zip
# and attaches it to a GitHub release. The checks below run first, so a broken
# commit can never be published - the job simply fails and nothing is released.
#
# A tag with a pre-release suffix (-rc1, -beta2, ...) is published as a
# GitHub *pre-release* and is deliberately not marked as the latest release, so
# the download links in the README and the docs site keep pointing at the last
# real version. It is a build to try before tagging the final, not a release in
# its own right. An rc also borrows the release notes of the version it leads to,
# so what you test and what you ship are described the same way.
#
# Re-running: "Run workflow" rebuilds the release for a tag that already exists,
# so a failed publish never needs the tag deleted and pushed again.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build the release for, e.g. v1.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    # Windows, not Linux: the toolkit only runs on Windows (registry, tasklist,
    # %LOCALAPPDATA%, the .cmd launcher), so that is where it is worth checking.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run builds the tag it was given, not the branch it is on.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check every source file parses
        shell: pwsh
        run: |
          # Judge by the exit code, not by stderr, so a failure names the file.
          $PSNativeCommandUseErrorActionPreference = $false
          Get-ChildItem src -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "syntax error in $($_.Name)" }
          }

      - name: Verify the profile operations
        # Seeded mode: builds its own throwaway database, touches no game files.
        run: npm run phase4

      - name: Build the zip
        id: build
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'dist\Civ6-Mod-Toolkit'
          New-Item -ItemType Directory -Path $stage | Out-Null
          # Everything the user needs; nothing that is rebuilt, downloaded or
          # personal. The launcher runs `npm install` itself on first start.
          $include = @(
            'Civ6 Mod Toolkit.cmd', 'src', 'public', 'docs', 'fixtures',
            'package.json', 'package-lock.json', 'README.md', 'CHANGELOG.md',
            'FINDINGS.md', 'LICENSE', 'civ6-paths.example.json'
          )
          foreach ($item in $include) {
            $path = Join-Path $env:GITHUB_WORKSPACE $item
            if (Test-Path $path) { Copy-Item $path -Destination $stage -Recurse }
          }
          $zip = "Civ6-Mod-Toolkit-$env:TAG.zip"
          Push-Location $env:GITHUB_WORKSPACE\dist
          # bsdtar rather than Compress-Archive, which writes '\' inside the zip
          # instead of '/'. The full path keeps the Git Bash tar off it, and the
          # relative name keeps tar from reading "C:" as a remote host.
          & "$env:SystemRoot\System32\tar.exe" -a -c -f $zip Civ6-Mod-Toolkit
          Pop-Location
          $built = Join-Path $env:GITHUB_WORKSPACE "dist\$zip"
          if (-not (Test-Path $built)) { throw "the zip was not created: $built" }
          Get-ChildItem (Join-Path $stage '*') -Recurse -File |
            Measure-Object -Property Length -Sum |
            ForEach-Object { "{0:N1} MB uncompressed" -f ($_.Sum / 1MB) }
          Write-Host "built dist\$zip"
          # Hand the exact path to the next step instead of rebuilding the name.
          "zip=dist/$zip" >> $env:GITHUB_OUTPUT

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          # A tag like v1.6.0-rc1 is a test build for the author to click, not a
          # release. Left alone, gh publishes it as a full release and --latest
          # hands it the "latest release" pointer, which is what the download
          # links in the README and the docs site follow. So the two are decided
          # together: pre-release, or latest - never both.
          $isPre = $env:TAG -match '-(alpha|beta|rc|pre)\.?\d*$'
          $roll = if ($isPre) { '--prerelease' } else { '--latest' }
          if ($isPre) { Write-Host "$env:TAG is a pre-release: publishing as a draft candidate, not the latest release" }

          # Prefer the CHANGELOG entry for this tag over GitHub's auto-generated
          # commit list, which is a wall of "Add ... to ..." lines. Fall back to
          # the generated notes if the entry is missing, so a release is never
          # published without any notes at all.
          $notes = $null
          $changelog = Join-Path $env:GITHUB_WORKSPACE 'CHANGELOG.md'
          if (Test-Path $changelog) {
            $lines = Get-Content $changelog
            # A pre-release tag has no heading of its own, so fall back to the
            # version it leads to: v1.6.0-rc1 borrows the notes for v1.6.0. An
            # author testing the build wants the same notes the real release will
            # carry, not the commit list.
            $candidates = @($env:TAG)
            if ($isPre -and $env:TAG -match '^(.+?)-\w+$') { $candidates += $Matches[1] }
            foreach ($cand in $candidates) {
              $start = -1
              for ($i = 0; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match "^##\s+$([regex]::Escape($cand))(\s|$)") { $start = $i; break }
              }
              if ($start -lt 0) { continue }
              $end = $lines.Count
              for ($i = $start + 1; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^##\s') { $end = $i; break }
              }
              # Drop the "## v1.2.0 - date" heading itself; the tag is the title.
              $body = @()
              if ($end -gt ($start + 1)) { $body = $lines[($start + 1)..($end - 1)] }
              while ($body.Count -and [string]::IsNullOrWhiteSpace($body[0])) { $body = $body[1..($body.Count - 1)] }
              while ($body.Count -and [string]::IsNullOrWhiteSpace($body[-1])) { $body = $body[0..($body.Count - 2)] }
              if ($body.Count) {
                $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
                Set-Content -Path $notes -Value ($body -join "`n") -Encoding utf8
                Write-Host "using the CHANGELOG entry for $cand ($($body.Count) lines)"
              }
              break
            }
          }
          if ($notes) {
            gh release create $env:TAG $env:ZIP --title $env:TAG --notes-file $notes $roll --verify-tag
          } else {
            Write-Warning "no CHANGELOG entry for $env:TAG; using generated notes"
            gh release create $env:TAG $env:ZIP --title $env:TAG --generate-notes $roll --verify-tag
          }
